app = 'jir'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile.api'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  ASPNETCORE_URLS = 'http://0.0.0.0:8080'
  ConnectionStrings__DefaultConnection = 'postgres://postgres:F9cZKYu3RANOjlo@jir-postgres.flycast:5432/postgres?sslmode=disable'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
