version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: jir-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jir_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jir_password}
      POSTGRES_DB: ${POSTGRES_DB:-jir_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jir-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jir_user} -d ${POSTGRES_DB:-jir_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Backend
  api:
    build:
      context: .
      dockerfile: src/JIR.WebAPI/Dockerfile
    container_name: jir-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-jir_db};Username=${POSTGRES_USER:-jir_user};Password=${POSTGRES_PASSWORD:-jir_password}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jir-network
    restart: unless-stopped

  # Blazor Frontend
  blazor:
    build:
      context: .
      dockerfile: src/JIR.BlazorApp/Dockerfile
    container_name: jir-blazor
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:3000
      - ApiBaseUrl=${API_BASE_URL:-http://api:8080}
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - jir-network
    restart: unless-stopped

networks:
  jir-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
